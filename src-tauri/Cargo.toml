[package]
name = "memflow"
version = "0.1.0"
description = "MemFlow - 本地 AI 第二大脑"
authors = ["ygw"]
license = "MIT"
repository = "https://github.com/ixxxxoooo/MemFlow"
readme = "../README.md"
edition = "2021"

[lib]
name = "memflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
# native-tls 在 macOS 使用系统 Security.framework,信任系统钥匙串里的证书(含代理工具的 MITM 证书);
# macos-system-configuration 让云端请求遵循系统代理设置
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "macos-system-configuration"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
jieba-rs = "0.7"
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
regex = "1"
# 字符编码识别(csv/txt 的 GBK、UTF-16,rtf 代码页)
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
# 大规模向量检索时并行计算相似度
rayon = "1"
# 本地 ONNX 重排序(bge-reranker)。模型文件由 model_fetch 走镜像下载,这里不启用 hf-hub
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-native-tls"], optional = true }

[features]
default = ["rerank"]
# 本地重排序;关闭后检索只做 RRF 融合
rerank = ["dep:fastembed"]

# API Key 存系统钥匙串(仅 macOS)
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
