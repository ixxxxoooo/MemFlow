name: Release

# 推送形如 v1.2.3 的 tag 时自动构建并发布;也可手动触发(仅用于调试构建,不会发布)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. 校验 tag 与各处版本号一致,并生成发布说明
  prepare:
    name: 校验版本并创建草稿 Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version package.json)-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json / Cargo.toml / tauri.conf.json 版本一致
        if: github.ref_type == 'tag'
        run: |
          V="${{ steps.meta.outputs.version }}"
          P="$(jq -r .version package.json)"
          T="$(jq -r .version src-tauri/tauri.conf.json)"
          C="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')"
          echo "tag=$V package.json=$P tauri.conf.json=$T Cargo.toml=$C"
          [[ "$V" == "$P" && "$V" == "$T" && "$V" == "$C" ]] || { echo "::error::版本号不一致"; exit 1; }

      - name: 从 CHANGELOG 生成发布说明
        if: github.ref_type == 'tag'
        run: |
          V="${{ steps.meta.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          [[ -s release-notes.md ]] || { echo "::error::CHANGELOG.md 中没有 $V 的条目"; exit 1; }
          {
            echo
            echo "---"
            echo
            echo "## 安装"
            echo
            echo "下载对应芯片的 \`.dmg\`:Apple Silicon 选 \`aarch64\`,Intel 选 \`x64\`。拖入「应用程序」后启动,并确保本机已安装并运行 [Ollama](https://ollama.com)。"
            echo
            echo "> 发布包为 ad-hoc 签名,未经 Apple 公证。若首次打开被 Gatekeeper 拦截,请右键 → 打开,或执行 \`xattr -cr /Applications/MemFlow.app\`。"
            echo
            echo "校验:\`shasum -a 256 -c SHA256SUMS.txt\`"
            echo
            echo "完整变更见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)。"
          } >> release-notes.md
          cat release-notes.md

      - name: 创建草稿 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRE=""
          [[ "$TAG" == *-* ]] && PRE="--prerelease"
          # 重跑时复用已有草稿
          # shellcheck disable=SC2086
          gh release create "$TAG" --draft $PRE --title "MemFlow $TAG" --notes-file release-notes.md \
            || gh release edit "$TAG" --draft --title "MemFlow $TAG" --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md

  # 2. 分架构构建 .dmg 并上传到草稿 Release
  build:
    name: 构建 ${{ matrix.name }}
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS (Apple Silicon)
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 版本需与 src-tauri/rust-toolchain.toml 保持一致
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 若要启用 Apple 开发者签名与公证,请在仓库 Secrets 中配置
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID,并把它们通过 env 传入下方步骤;
      # 未配置时使用 tauri.conf.json 中的 ad-hoc 签名("-")。
      - name: 构建并上传 (tag)
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles dmg

      - name: 构建 (手动触发,仅产出构建物)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles dmg

      - name: 手动触发时上传构建物
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 3. 汇总校验和并正式发布
  publish:
    name: 生成校验和并发布
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 下载全部 dmg 并校验数量
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir assets && cd assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.dmg'
          ls -lh
          COUNT="$(find . -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')"
          [[ "$COUNT" == "2" ]] || { echo "::error::期望 2 个 dmg,实际 $COUNT"; exit 1; }
          [[ -n "$(find . -maxdepth 1 -name '*aarch64*.dmg')" ]] || { echo "::error::缺少 aarch64 dmg"; exit 1; }
          [[ -n "$(find . -maxdepth 1 -name '*x64*.dmg')" ]] || { echo "::error::缺少 x64 dmg"; exit 1; }

      - name: 生成 SHA256SUMS.txt 并上传
        run: |
          cd assets
          sha256sum ./*.dmg | sed 's# \./# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

      - name: 正式发布
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --draft=false
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --json url,assets --jq '.url, (.assets[] | .name)'
