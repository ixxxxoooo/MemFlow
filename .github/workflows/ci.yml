name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/PR 的新提交会取消旧的运行,节省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  frontend:
    name: 前端 (类型检查 / 构建 / 测试)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与构建
        run: pnpm build

      - name: 单元测试
        run: pnpm test

  rust:
    name: Rust (fmt / clippy / 测试)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 版本需与 src-tauri/rust-toolchain.toml 保持一致
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri 的编译期会校验 frontendDist 目录是否存在,需先构建前端
      - name: 构建前端产物
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 格式检查
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试 (单元 + mock Ollama 集成)
        working-directory: src-tauri
        run: cargo test --all-targets
