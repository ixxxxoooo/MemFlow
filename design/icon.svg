<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MemFlow 图标:靛蓝渐变底 + 一笔连成的「M」记忆流,谷底的光点代表被记住的内容 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b7bf5"/>
      <stop offset="0.55" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#3a3aa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe0ff"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffc857"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="clipbg"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#clipbg)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后层流线(错位的淡色副本,表现“流动”) -->
    <path d="M276 716 C276 566 286 372 346 338 C418 298 468 540 512 626 C556 540 606 298 678 338 C738 372 748 566 748 716"
          stroke="#ffffff" stroke-opacity="0.22" stroke-width="58" transform="translate(0 44)"/>
    <!-- 主流线 -->
    <path d="M276 716 C276 566 286 372 346 338 C418 298 468 540 512 626 C556 540 606 298 678 338 C738 372 748 566 748 716"
          stroke="url(#ribbon)" stroke-width="66"/>
  </g>
  <!-- 谷底光点 -->
  <circle cx="512" cy="652" r="64" fill="#ffc857" opacity="0.55" filter="url(#soft)"/>
  <circle cx="512" cy="652" r="30" fill="url(#spark)"/>
</svg>
